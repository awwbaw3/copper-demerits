name = "copper-demerits-api"
main = "cloudflare/worker.js"
compatibility_date = "2025-02-01"

[[d1_databases]]
binding = "DB"
database_name = "copper-demerits-db"
database_id = "feb899d8-606e-4937-91b7-9076e2741961"

[[r2_buckets]]
binding = "SLIPS_BUCKET"
bucket_name = "copper-demerits-slips"

[ai]
binding = "AI"

[[routes]]
pattern = "api.copperdemerits.com"
custom_domain = true

[triggers]
crons = ["0 21 * * 5"]
